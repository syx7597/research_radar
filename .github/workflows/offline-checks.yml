name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -B -m unittest discover -s tests -v
      - run: python -B -m unittest experiments.condition_consistency.test_ranking -v
      - run: python -B -m unittest experiments.condition_consistency.test_schema_constraints -v
      - run: python -B -m unittest experiments.condition_consistency.test_repair experiments.condition_consistency.test_repair_selection experiments.condition_consistency.test_executor_state experiments.condition_consistency.test_repair_guard -v
      - run: python -B scripts/check_public_tree.py
